[project]
name = "iconreplacer"
dynamic = ["version"]
description = "Modern, resizable folder icon picker integrated with Windows Explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
iconreplacer = "iconreplacer.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/iconreplacer/version.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/iconreplacer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "registry: touches the real HKCU IconReplacer verb key (R1, snapshot + verified rollback)",
    "build: slow end-to-end PyInstaller release build (skipped unless -m build)",
    "network: live smoke test against public APIs (skipped unless ICONREPLACER_NETWORK_TESTS=1)",
]
addopts = "-m 'not build'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/iconreplacer/ui/theme.py" = ["E501"]  # long QSS lines
